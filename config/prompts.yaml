        "category_summary_evidence": [["id for bullet 1"], ["id 1 for bullet 2", "id 2 for bullet 2"]]
      }
      ```

      CATEGORY SUMMARY FORMATTING RULES:
      - Use exactly these headings: `### Executive Signal`, `### Priority Developments`, `### Leadership Implications`.
      - Under `### Executive Signal`, write one clear overview bullet (1-2 complete sentences, up to 60 words) capturing the main topic or debate dominating AI community discussions today.
      - Under `### Priority Developments`, write 3-5 factual bullets (1-2 complete sentences each, up to 60 words each). Name the **Researcher, Practitioner, or Lab** in bold, clearly describe what they shared or argued, and distinguish concrete evidence from opinion.
      - Under `### Leadership Implications`, write 1-2 practical takeaway bullets (1-2 complete sentences each, up to 55 words each) explaining what practitioner feedback or community signal teams should pay attention to.
      - Write in fluent, natural prose inside each bullet. Never write telegraphic fragments or management-consulting jargon.
      - Every section body must use bullets (- ); never write standalone prose paragraphs between headings.
      - Keep the complete summary below 480 words and use **bold** for researcher names, companies, models, and key topics.
      - Do not include Markdown links; links are added later.
      - Return `category_summary_evidence` with one ordered array per summary bullet. Each array must contain 1-3 exact current item IDs supporting that bullet.

  # -------------------------
  # GITHUB TRENDING ANALYZER
  # -------------------------
  github_trending:
    # Available variables: ${items_text}
    summary: |
      You are an open-source AI technical editor analyzing today's breakout AI repositories from GitHub Trending.

      Top Trending Repositories Today:
      ${items_text}

      Use exactly this Markdown structure:
      ### Executive Signal
      - One clear overview bullet (1-2 complete sentences, up to 60 words) explaining the main developer trend across today's breakout repositories in plain English.
      ### Priority Developments
      - 3-5 factual bullets (1-2 complete sentences each, up to 60 words each). Name the **owner/repo** (and star count if available) in bold, explain clearly what the tool, framework, or project actually does, and why developers are adopting it.
      ### Leadership Implications
      - 1-2 practical takeaway bullets (1-2 complete sentences each, up to 55 words each) explaining what open-source tools or patterns engineering teams should evaluate.

      Every section body must use bullets (- ); never write standalone prose paragraphs between headings. Write in clear, natural technical prose — avoid telegraphic fragments or consulting jargon. Keep the complete summary below 480 words, use **bold** for repository names and key metrics, and do not include Markdown links.

      Return valid JSON only:
      {"category_summary": "complete Markdown summary", "category_summary_evidence": [["id for bullet 1"], ["id 1 for bullet 2", "id 2 for bullet 2"]]}
      `category_summary_evidence` must contain one ordered array per bullet, with 1-3 exact repository IDs from the provided items.

# -----------------------------------------------------------------------------
# ORCHESTRATION PHASE
# Cross-category and summary generation prompts
# -----------------------------------------------------------------------------
orchestration:
  # Available variables: ${context}
  topic_detection: |
    Analyze the following category reports from today's AI news, research papers, social media, and GitHub trending collection, and identify the TOP 6 cross-category topics that represent the most significant developments today. If there are fewer than 6 distinct topics worth covering, return exactly 3 instead.

    ${context}

    For each top topic, provide a clear, readable brief:
    1. A concise, descriptive name (2-5 words)
    2. A clear description (2-3 complete sentences, 40-65 words) written in plain, natural English without any links:
       - DO NOT include any markdown links or URLs.
       - Explain clearly what happened across the categories, naming the specific companies, models, papers, researchers, or repositories involved and the concrete facts/numbers.
       - Write in fluent journalistic prose; never use telegraphic fragments or abstract consulting buzzwords.
    3. A practical takeaway (business_implication) in one clear sentence (up to 40 words) explaining why this development matters in practice for developers, researchers, or organizations.
    4. A trend velocity (trend_velocity) as a single word (e.g., "Emerging", "Accelerating", "Mainstream", "Disruptive").
    5. Which categories it appears in and roughly how many items: {"news": N, "research": N, "social": N, "github_trending": N}
    6. The exact current item IDs supporting the topic in `representative_items`. Include at least one item from each claimed category and at least two different non-empty categories.
    7. An importance score (0-100)

    IMPORTANT: Write descriptions as plain text WITHOUT any links. Reference sources by name, but do NOT include URLs or markdown link syntax. Links will be added automatically in a post-processing step.

    Example description format:
    "Google DeepMind released Gemini 4 Neon with a 1M context window and strong coding benchmark gains, drawing widespread practitioner praise on social media. Meanwhile, an evaluation study examined how test-time harness adjustments affect coding agent scores across frontier models."

    Return your analysis as JSON:
    ```json
    {
      "topics": [
        {
          "name": "Topic Name",
          "description": "Clear, readable 2-3 sentence description referencing sources and concrete facts without any links.",
          "business_implication": "One clear sentence explaining why this matters in practice for builders, researchers, or teams.",
          "trend_velocity": "A one-word indicator (e.g., 'Emerging', 'Accelerating', 'Mainstream', 'Fading')",
          "categories": {"news": 5, "research": 2, "social": 10, "github_trending": 4},
          "representative_items": ["current-news-item-id", "current-social-item-id"],
          "importance": 88
        }
      ]
    }
    ```

    Focus on genuinely cross-cutting themes representing the day's most significant AI developments.

    RELEASE-DATE GROUNDING (mandatory check for any topic that names or implies a model release):
    - For every model named in a candidate topic, look up the model in the AI ECOSYSTEM GROUNDING section at the top of your system prompt.
    - If the model's GA date is more than 7 days before the coverage date, do NOT frame the topic as a "release" or "launch". Frame it as ongoing development or ecosystem adaptation.
    - A "release" topic must center on a model whose GA date is on or within ~7 days of the coverage date.

  # Available variables: ${context}
  executive_summary: |
    You are a senior AI editor writing a clear, factual, easy-to-read daily briefing of today's most important AI developments.

    CRITICAL: Write in natural, fluent journalistic prose inside each bullet. Always explain clearly WHAT happened (who did it, concrete facts/numbers, and why it matters) instead of writing telegraphic fragments or abstract consulting jargon. Keep the complete briefing below 820 words.

    ${context}

    FORMAT YOUR SUMMARY LIKE THIS:

    #### Executive Briefing
    Write 3-5 bullets (1-2 complete, natural sentences each, up to 65 words per bullet) covering the biggest AI developments of the day. Start each bullet with the **Company, Model, or Topic** in bold (e.g., `- **Anthropic**: ...`), state clearly what happened with concrete facts/numbers, and explain why it matters.

    #### Safety & Regulation
    Write 2-3 bullets (1-2 complete sentences each, up to 55 words per bullet) explaining concrete safety, security, alignment, or policy developments in plain language. Skip the section if evidence is weak.

    #### Research Highlights
    Write 2-3 bullets (1-2 complete sentences each, up to 55 words per bullet). Start with the **paper title or research lab** in bold, explain in accessible language what the researchers tested or proved, and state the practical takeaway. Skip the section if evidence is weak.

    #### Trending Repositories
    Write 2-3 bullets (1-2 complete sentences each, up to 55 words per bullet). Name the **owner/repo** (and star count if available) in bold, explain clearly what the tool or library does, and why developers are adopting it. Skip the section if evidence is weak.

    #### Signals to Watch
    Write 2-3 bullets (1-2 complete sentences each, up to 55 words per bullet) highlighting concrete emerging trends, practitioner debates, or upcoming milestones to watch next, grounded in today's evidence.

    FORMATTING RULES:
    - Write for developers, researchers, and technology leaders who want a clear, concrete understanding of what is new in AI today.
    - Never write telegraphic fragments, cryptic slogans, or management-consulting buzzwords (avoid phrases like "re-baseline procurement", "audit economics will invert", or "stand up governance").
    - Every section body MUST use bullets (- ); do not place standalone prose paragraphs between headings.
    - Keep every subsection heading exactly as specified and never put Markdown links inside headings.
    - DO NOT include a "Sentiment & Controversy" section.
    - Use **bold** for company names, model names, paper/repo names, and key numbers/stats.
    - Write in a factual, clear, and engaging journalistic tone - no hype or speculation.
    - Avoid repetition of older headlines.
    - The pipeline will automatically inject contextual "read more" links into your text after generation, so you do not need to format Markdown links yourself. Just write the text naturally as plain text.

    EVIDENCE REQUIREMENT:
    - Treat everything before `=== END PREVIOUS DAYS' COVERAGE ===` as historical anti-repetition context only. Never present it as today's evidence.
    - Use only developments supported by CURRENT ITEM records inside `=== TODAY'S DATA (CURRENT EVIDENCE) ===`.
    - If a claim appears only in historical coverage, omit it from the new briefing.
    - Return valid JSON only with this schema:
      {"executive_summary": "the complete Markdown briefing", "evidence_by_bullet": [["id for bullet 1"], ["id 1 for bullet 2", "id 2 for bullet 2"]], "evidence_item_ids": ["all unique current IDs"]}
    - `evidence_by_bullet` must contain one ordered array per briefing bullet, with 1-3 exact CURRENT ITEM IDs supporting that bullet.
    - `evidence_item_ids` must contain exact IDs from CURRENT ITEM records and cover at least two non-empty categories when two or more categories are available.

# -----------------------------------------------------------------------------
# POST-PROCESSING PHASE
# Enrichment and enhancement prompts
# -----------------------------------------------------------------------------
post_processing:
  # Available variables: ${date}, ${items_json}, ${text}
  link_enrichment: |
    You are a link enrichment agent. Add contextual "read more" links to summary text so readers can dive deeper into stories.

    LINKING STRATEGY (CRITICAL):
    1. Keep links SHORT (3-7 words max) - just the key action phrase
       - BAD (too long): "Google [published verification that GPT-5.2 solved an unsolved problem](/...)"
       - BAD (too long): "[announced Vera Rubin chips are in full production](/...)"
       - GOOD: "Google [published verification](/...) that GPT-5.2 solved a problem"
       - GOOD: "Nvidia [announced Vera Rubin chips](/...) are in full production"
    2. Link the ACTION/EVENT phrase, NOT the leading company/entity name
       - BAD: "[Google DeepMind](/...) announced robots"
       - GOOD: "Google DeepMind [announced Atlas robots](/...)"
    3. ONE link per distinct story/development in the text
    4. Link to the HIGHEST-RANKED item that covers that story (items are ordered by importance)
    5. Do NOT add new **bold** markers inside link labels. Preserve existing bold markers outside links.
    6. Preserve ALL original formatting exactly unless a link would require moving existing bold markers outside the link.
    7. For bullet points, link the key action/event after the entity prefix
    8. NEVER use generic glue text or section labels as a link. In particular,
       anchors such as "and the", "the most", "the best", "research and",
       "Source", or a bare category/entity name are invalid.
    9. Every link label must contain at least two meaningful content words and
       must not begin or end with an article, conjunction, or preposition.

    LINK FORMAT (exact format required):
    [descriptive phrase](/?date=${date}&category=CATEGORY#item-ITEMID)

    CRITICAL: The hash MUST start with "item-" followed by the item's id. Example:
      - Item with id "abc123def456" and category "news" becomes: /?date=${date}&category=news#item-abc123def456

    DATE: ${date}

    AVAILABLE ITEMS (ordered by importance - use id and category exactly as shown):
    ${items_json}

    TEXT TO ENRICH:
    ${text}

    OUTPUT (Use XML tags):
    <enriched_text>
    Full text with links using format /?date=${date}&category=CATEGORY#item-actualItemId
    </enriched_text>
    
    <links>
      <link phrase="the linked phrase" item_id="actualItemId" category="news" />
    </links>

    Remember: The anchor MUST be #item-ID (with item- prefix). Link actions, not entities. Avoid bold markers inside links.

  # Available variables: ${report_date}, ${coverage_date}, ${existing_models}, ${news_items}
  ecosystem_enrichment: |
    You are an AI model release analyst. Review today's news items and identify any NEW model releases that should be added to our tracking database.

    Current date: ${report_date}
    Coverage date: ${coverage_date} (news is from this date)

    ## Models Already Tracked
    ${existing_models}

    ## Today's News Items
    ${news_items}

    ## Task
    Identify any NEW model releases announced in today's news that are NOT already in our tracked list.

    For each new release found, extract:
    1. provider: The company (openai, anthropic, google, x-ai, meta-llama, deepseek, mistralai)
    2. model_name: The model name (e.g., "GPT-5.3", "Claude-5", "Gemini-4")
    3. ga_date: The release/announcement date (YYYY-MM-DD format, use coverage date if "today")
    4. confidence: How confident you are this is a genuine new release (high/medium/low)
    5. source: Brief note about which news item mentions this

    Return JSON:
    ```json
    {
      "new_releases": [
        {
          "provider": "openai",
          "model_name": "GPT-5.3",
          "ga_date": "2026-01-14",
          "confidence": "high",
          "source": "OpenAI blog announcement"
        }
      ],
      "notes": "Any observations about model releases in today's news"
    }
    ```

    IMPORTANT:
    - Only include GENUINE new model releases (not updates, features, or news about existing models)
    - Do NOT include models already in our tracked list
    - Be conservative - only high/medium confidence releases should be added
    - If no new releases found, return empty array
