      Prioritize: recognized AI researchers, original insights, breaking news, technical depth, high engagement.
      Deprioritize: promotional content, retweets without commentary, off-topic tangents.

      RELEASE-DATE GROUNDING: If a post discusses a specific model by name, check the AI ECOSYSTEM GROUNDING section in your system prompt. Do not describe a model as "newly released" or "just launched" in your summary if its GA date is more than 7 days before the coverage date — it is community discussion of an existing model.

    # Available variables: ${items_context}
